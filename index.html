<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Watashi no Nihongo</title>
    <meta name="description" content="Targetes per aprendre japonès: hiragana, katakana, kanji i vocabulari." />
    <meta name="theme-color" content="#faf7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16141a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica el tema abans del primer pintat per evitar un parpelleig.
      try {
        var s = JSON.parse(localStorage.getItem('wnn.settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
        if (s.language) document.documentElement.lang = s.language;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
